name: Ransomware live feed

# Refreshes output/live/victims.json and output/live/chemical.json for the
# Ransomware Intelligence Dashboard (GitHub feed mode).
on:
  schedule:
    - cron: "17,47 * * * *"   # every 30 minutes (GitHub may delay scheduled runs)
  workflow_dispatch: {}        # "Run workflow" button for manual refresh

permissions:
  contents: write

concurrency:
  group: ransomware-live-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch feeds from ransomware.live API PRO
        env:
          RL_API_KEY: ${{ secrets.RL_API_KEY }}
          MONTHS: "12"
          OUT: output/live
        run: node scripts/update-live-feed.mjs

      - name: Commit updated feeds
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/live/*.json
          if git diff --cached --quiet; then
            echo "No feed changes – nothing to commit."
            exit 0
          fi
          git commit -m "Update live ransomware feed $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
